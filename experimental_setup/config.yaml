# Experiment Configuration
# SS1 defined the account-activation problem; SS2 proves it on the public
# UCI Bank Marketing dataset (bank-additional-full.csv).
experiment:
  name: account_activation_prediction_ss2_public_proof
  target_variable: y            # bank marketing: term-deposit subscription (yes/no)
  public_dataset: bank-additional-full.csv
  leakage_columns_dropped: [duration]

data_split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  method: stratified            # preserves the ~11.3% positive prevalence
  stratify_by: y
  random_state: 42
  # NOTE: a chronological split was tested and revealed strong non-stationarity
  # (subscription rate 5% -> 38% over 2008-2010). See Preprocessing.MD.

models:
  # Model 1 - interpretable linear baseline
  - name: logistic_regression
    script: src/train_model1_logreg.py
    class: LogisticRegression
    params:
      max_iter: 1000
      class_weight: balanced
      C: 1.0
      solver: lbfgs

  # Model 2 - gradient-boosted trees
  - name: xgboost
    script: src/train_model2_xgboost.py
    class: XGBClassifier
    params:
      n_estimators: 400
      max_depth: 5
      learning_rate: 0.05
      subsample: 0.9
      colsample_bytree: 0.9
      min_child_weight: 2
      reg_lambda: 1.0
      early_stopping_rounds: 30
      scale_pos_weight: auto     # computed as n_neg / n_pos at train time
      eval_metric: auc

imbalance_handling:
  strategy: cost_sensitive       # class_weight / scale_pos_weight (no resampling)

evaluation:
  primary_metric: roc_auc
  secondary_metrics:
    - precision
    - recall
    - f1_score
    - pr_auc
    - lift_top_decile
  statistical_tests:
    - mcnemar                    # paired test-set predictions
    - bootstrap_auc_ci           # 1000 resamples
    - cv_paired_ttest            # 5-fold stratified CV
  success_criteria:
    roc_auc_min: 0.75
    lift_top_decile_min: 2.0
